# Configuración básica de Nginx para el Proxy Inverso (Módulo 1)
# Archivo: nginx.conf

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logs de acceso y errores
    access_log  /var/log/nginx/access.log;
    error_log   /var/log/nginx/error.log warn;

    # Optimización de transferencia de datos
    sendfile        on;
    keepalive_timeout  65;

    # Redirección global de HTTP (Puerto 80) a HTTPS (Puerto 443)
    server {
        listen 80;
        server_name homelab.local;

        return 301 https://$host$request_uri;
    }

    # Configuración del servidor seguro HTTPS (Puerto 443)
    server {
        listen 443 ssl;
        server_name homelab.local;

        # Configuración de Certificados SSL
        ssl_certificate     /etc/nginx/certs/homelab.local.crt;
        ssl_certificate_key /etc/nginx/certs/homelab.local.key;

        # Parámetros recomendados de seguridad SSL
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Cabeceras de seguridad globales
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-XSS-Protection "1; mode=block";
        add_header X-Content-Type-Options "nosniff";

        # 1. Ruteo para la página web estática (Frontend básico)
        location / {
            # Se asume que redirige al contenedor 'web-static'
            proxy_pass http://web-static:80;
            
            # Cabeceras HTTP estándar para proxy
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2. Ruteo para el ejercicio 1 (/whoami)
        # Descomenta esta sección en el ejercicio 1
        # location /whoami {
        #     proxy_pass http://whoami:80;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # }
    }
}
