# Configuración Global de Prometheus
# Archivo: prometheus.yml

global:
  scrape_interval:     15s # Intervalo en el que Prometheus realiza scraping de los objetivos
  evaluation_interval: 15s # Intervalo en el que evalúa las reglas de alertas

# Reglas de alerta cargadas en el servidor
rule_files:
  # - "alert.rules.yml"

# Configuración de Scraping (Objetivos de Monitoreo)
scrape_configs:
  # 1. Monitorear al propio Prometheus
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 2. Monitorear el hardware del host Debian (Node Exporter)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # 3. Monitorear el estado de los contenedores Docker (cAdvisor)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # 4. Monitorear el rendimiento de tu API Backend
  - job_name: 'api-backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api-backend:3000'] # Apunta al contenedor y puerto de la API backend
